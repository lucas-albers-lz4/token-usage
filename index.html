<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSP via meta: GitHub Pages does not serve custom headers (_headers is
     inert on github.com — verified luna gate 2026-08-13). No inline
     scripts/styles or external origins, so 'self' is sufficient. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'none'">
<title>token-usage · LLM provider credit tracker</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header>
  <h1>token-usage</h1>
  <p class="sub">Daily snapshots of LLM provider credits &amp; spend, collected by scheduled jobs and committed as data.</p>
</header>
<main>
  <div id="status" class="status" hidden></div>
  <section id="cards" class="cards"></section>
  <p id="updated" class="meta"></p>
</main>
<footer>
  <p>Data lives in <code>data/usage.json</code>, <code>data/cursor.json</code>, <code>data/opencode.json</code> · API keys never leave repo secrets / your machines</p>
</footer>
<script src="assets/js/app.js"></script>
</body>
</html>
