name: Collect usage

on:
  schedule:
    - cron: "17 3 * * *" # daily 03:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect provider usage
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python3 scripts/collect_usage.py
      - name: Validate data
        run: python3 scripts/validate_data.py
      - name: Commit snapshot (if changed)
        run: |
          git config user.name "Lucas Albers"
          git config user.email "lucas.b.albers@gmail.com"
          git add data/usage.json
          if git diff --cached --quiet; then
            echo "No usage change to commit"
          else
            git commit -m "data: usage snapshot $(date -u +%F)"
            git pull --rebase --autostash origin main || true
            git push
          fi
